<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0aaff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="30" cy="25" r="1" fill="#a78bfa" opacity="0.6"/>
  <circle cx="170" cy="40" r="1.2" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="60" cy="170" r="0.8" fill="#818cf8" opacity="0.7"/>
  <circle cx="155" cy="160" r="1" fill="#a78bfa" opacity="0.5"/>
  <circle cx="20" cy="130" r="0.8" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="180" cy="110" r="1.2" fill="#818cf8" opacity="0.5"/>

  <!-- Outer rings -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.3"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="#8b5cf6" stroke-width="0.8" opacity="0.4"/>
  <circle cx="100" cy="100" r="44" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>

  <!-- Glow behind eye -->
  <ellipse cx="100" cy="100" rx="38" ry="22" fill="url(#eyeGlow)" opacity="0.5" filter="url(#glow)"/>

  <!-- Eye white / outline -->
  <path d="M 38 100 Q 100 58 162 100 Q 100 142 38 100 Z" fill="#1a0535" stroke="#a78bfa" stroke-width="1.5" opacity="0.9"/>

  <!-- Iris -->
  <circle cx="100" cy="100" r="22" fill="url(#iris)" filter="url(#glow)"/>

  <!-- Pupil -->
  <circle cx="100" cy="100" r="11" fill="#0d0020"/>

  <!-- Pupil shine -->
  <circle cx="94" cy="95" r="4" fill="#e0aaff" opacity="0.6"/>
  <circle cx="106" cy="104" r="2" fill="#c084fc" opacity="0.3"/>

  <!-- Inner ring on iris -->
  <circle cx="100" cy="100" r="17" fill="none" stroke="#e0aaff" stroke-width="0.8" opacity="0.5"/>
</svg>
