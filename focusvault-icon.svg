<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="60%" stop-color="#0f0828"/>
      <stop offset="100%" stop-color="#060412"/>
    </radialGradient>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#e2c4ff"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eyeClip">
      <path d="M 52 100 Q 100 62 148 100 Q 100 138 52 100 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="90" fill="url(#nebula)"/>

  <!-- Faint star dots -->
  <circle cx="28" cy="32" r="0.9" fill="#a78bfa" opacity="0.7"/>
  <circle cx="172" cy="28" r="0.7" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="165" cy="168" r="1" fill="#a78bfa" opacity="0.4"/>
  <circle cx="35" cy="162" r="0.8" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="185" cy="90" r="0.6" fill="#818cf8" opacity="0.6"/>
  <circle cx="18" cy="108" r="0.7" fill="#a78bfa" opacity="0.5"/>

  <!-- Concentric rings — 4 rings, evenly spaced -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#9b6fe0" stroke-width="1.2" opacity="0.35"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="#a87de8" stroke-width="1.3" opacity="0.45"/>
  <circle cx="100" cy="100" r="48" fill="none" stroke="#b88ff0" stroke-width="1.4" opacity="0.55"/>
  <circle cx="100" cy="100" r="34" fill="none" stroke="#c9a8f4" stroke-width="1.5" opacity="0.65"/>

  <!-- Eye whites / sclera fill -->
  <path d="M 52 100 Q 100 62 148 100 Q 100 138 52 100 Z" fill="#d8b8ff" opacity="0.15"/>

  <!-- Eye outline -->
  <path d="M 52 100 Q 100 62 148 100 Q 100 138 52 100 Z"
        fill="none" stroke="#c4a0f5" stroke-width="1.8" filter="url(#softglow)"/>

  <!-- Iris -->
  <circle cx="100" cy="100" r="22" fill="url(#iris)" filter="url(#softglow)" clip-path="url(#eyeClip)"/>

  <!-- Pupil -->
  <circle cx="100" cy="100" r="10" fill="#150930" clip-path="url(#eyeClip)"/>

  <!-- Pupil highlight -->
  <circle cx="95" cy="96" r="3.5" fill="#f0e0ff" opacity="0.55" clip-path="url(#eyeClip)"/>
</svg>
